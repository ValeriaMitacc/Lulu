<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Lulu 💜</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;
}

/* 🌌 ESTRELLAS */
.stars span {
  position: absolute;
  width: 2px;
  height: 2px;
  background: #fff;
  border-radius: 50%;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from { opacity: 0.3; }
  to { opacity: 1; }
}

/* 💜 CONTENEDOR */
.container {
  position: relative;
  width: 320px;
  height: 320px;
}

/* 💖 LATIDO GLOBAL */
@keyframes latidoGlobal {
  0%,100% { 
    transform: scale(1);
    filter: drop-shadow(0 0 5px #d8a4ff);
  }

  50% { 
    transform: scale(1.15);
    filter: drop-shadow(0 0 25px #d8a4ff);
  }
}

.latir {
  animation: latidoGlobal 1.5s ease-in-out infinite;
}

/* 💜 CORAZÓN */
.heart {
  position: absolute;
  width: 100%;
  height: 100%;
}

/* 💡 PALABRAS */
.word {
  position: absolute;
  color: #d8a4ff;
  font-size: 7px;
  white-space: nowrap;
  opacity: 0;

  text-shadow:
    0 0 5px #d8a4ff,
    0 0 10px #d8a4ff,
    0 0 25px #d8a4ff;

  animation: aparecer 2s forwards;
}

@keyframes aparecer {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* 💖 LULU */
.nombre {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  
  font-family: 'Great Vibes', cursive;
  font-size: 26px;
  color: white;
  letter-spacing: 2px;

  text-shadow:
    0 0 10px #d8a4ff,
    0 0 20px #d8a4ff;

  opacity: 0;
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="container latir">
  <div class="heart" id="heart"></div>
  <div class="nombre" id="name"></div>
</div>

<script>
const heart = document.getElementById("heart");
const name = document.getElementById("name");
const stars = document.getElementById("stars");

/* 🌌 ESTRELLAS */
for (let i = 0; i < 50; i++) {
  let star = document.createElement("span");
  star.style.top = Math.random() * 100 + "vh";
  star.style.left = Math.random() * 100 + "vw";
  stars.appendChild(star);
}

/* 💜 CORAZÓN (CENTRADO REAL) */
let scale = 10;
let centerX = 160;
let centerY = 160;

for (let t = 0; t < Math.PI * 2; t += 0.1) {
  let x = 16 * Math.pow(Math.sin(t), 3);
  let y = 13 * Math.cos(t) - 5 * Math.cos(2*t)
        - 2 * Math.cos(3*t) - Math.cos(4*t);

  let span = document.createElement("span");
  span.className = "word";
  span.innerText = "I love you";

  span.style.left = (centerX + x * scale) + "px";
  span.style.top = (centerY - y * scale) + "px";

  span.style.transform = "translate(-50%, -50%)";
  span.style.animationDelay = (t * 0.5) + "s";

  heart.appendChild(span);
}

/* 💖 LULU FORMÁNDOSE */
const text = "Lulu";
let index = 0;

function escribirNombre() {
  if (index < text.length) {
    name.style.opacity = 1;
    name.textContent += text[index];
    index++;
    setTimeout(escribirNombre, 300);
  }
}

setTimeout(() => {
  escribirNombre();
}, 500);

</script>

</body>
</html>
